<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — Pilar 360</title>
  <meta name="description" content="Novidades, mercado imobiliário e dicas da Pilar360.">
  <link rel="icon" type="image/svg+xml" href="/imagens/favicon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="/imagens/favicon-48.png">
  <link rel="apple-touch-icon" href="/imagens/apple-touch-icon.png">
  <link rel="stylesheet" href="/src/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>

  <!-- NAV -->
  <div id="site-header"></div>
  <div id="conteudo"></div>

  <!-- HERO -->
  <section class="blog-hero">
    <div class="fade-in">
      <h1 class="titulo-xl">Blog</h1>
      <p class="lead" style="margin-top:1rem">Notícias das obras, o caminho até o primeiro imóvel e o mercado da Grande Porto Alegre.</p>
    </div>
  </section>

  <!-- FILTROS -->
  <div class="blog-filters fade-in" id="blog-filters">
    <button class="blog-filter-btn active" data-cat="todos">Todos</button>
    <button class="blog-filter-btn" data-cat="Empresa">Empresa</button>
    <button class="blog-filter-btn" data-cat="Mercado">Mercado</button>
    <button class="blog-filter-btn" data-cat="Dicas">Dicas</button>
  </div>

  <!-- GRID -->
  <section class="blog-section">
    <div class="blog-grid" id="blog-grid"></div>
    <div style="text-align:center;margin-top:3rem;">
      <button class="btn-outline" id="btn-load-more" style="display:none;">Carregar mais</button>
    </div>
  </section>

  <!-- FOOTER -->
  <div id="site-footer"></div>

  <script type="module" src="/src/js/blog.js"></script>
</body>
</html>
